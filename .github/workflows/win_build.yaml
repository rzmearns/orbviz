name: Build Release EXE

on:
  push:
    branches:
      - feature/exe  # Triggers when code is merged into release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Set Version Timestamp
        id: vtimestamp
        run: echo "VTIMESTAMP=$(date +"%Y%m%d%H%M%S")" >> $GITHUB_ENV

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller orbviz-pyinstaller-package.spec

      - name: Zip Bundle
        run: Compress-Archive -Path dist/* -DestinationPath orbviz-win.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v$VTIMESTAMP
          name: Release v$VTIMESTAMP
          draft: false
          prerelease: false
          files: |
            orbviz-win.zip