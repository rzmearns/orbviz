name: Build Release EXE

on:
  push:
    branches:
      - release  # Triggers when code is merged into release

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller orbviz-pyinstaller-package.spec

      - name: Generate Release Tag
        id: tag
        run: |
          echo "RELEASE_TAG=$(date +'%Y.%m.%d-%H%M')" >> $env:GITHUB_ENV

      - name: Zip Bundle
        run: Compress-Archive -Path dist/* -DestinationPath orbviz-win-v${{ env.RELEASE_TAG }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_TAG }}
          name: Release v${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            orbviz-win-v${{ env.RELEASE_TAG }}.zip